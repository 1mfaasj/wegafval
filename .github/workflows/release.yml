name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer of tag en manifest-versie gelijk zijn
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSIE=$(python3 -c "import json;print(json.load(open('custom_components/rwm_afval/manifest.json'))['version'])")
          if [ "$TAG" != "$VERSIE" ]; then
            echo "::error::Tag v$TAG komt niet overeen met manifest-versie $VERSIE"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
